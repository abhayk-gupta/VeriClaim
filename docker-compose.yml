version: "3.9"

services:
  api:
    build: .
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./audio:/app/audio
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://vericlaim:secret@db:5432/vericlaim
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CLOUDFLARE_R2_ENDPOINT=http://minio:9000
      - CLOUDFLARE_R2_ACCESS_KEY=vericlaim_admin
      - CLOUDFLARE_R2_SECRET_KEY=vericlaim_secret_password
      - CLOUDFLARE_R2_BUCKET=vericlaim-media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    working_dir: /app
    command: celery -A worker.celery_app worker --loglevel=info -Q claims,notifications,calls -c 2
    volumes:
      - ./:/app
      - ./audio:/app/audio
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://vericlaim:secret@db:5432/vericlaim
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CLOUDFLARE_R2_ENDPOINT=http://minio:9000
      - CLOUDFLARE_R2_ACCESS_KEY=vericlaim_admin
      - CLOUDFLARE_R2_SECRET_KEY=vericlaim_secret_password
      - CLOUDFLARE_R2_BUCKET=vericlaim-media
    depends_on:
      - db
      - redis

  beat:
    build: .
    working_dir: /app
    # Relocated schedule database file to /tmp to bypass Windows file sharing lockups
    command: celery -A worker.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vericlaim
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: vericlaim
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vericlaim"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"       # S3 API Endpoint port
      - "9001:9001"       # Web Console administrator panel
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: vericlaim_admin
      MINIO_ROOT_PASSWORD: vericlaim_secret_password
    command: server /data --console-address ":9001"

  flower:
    image: mher/flower:2.0
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
  minio_data: