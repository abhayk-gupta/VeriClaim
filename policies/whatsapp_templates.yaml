templates:
  - id: "clarification_photo"
    name: "Request Clearer Photo"
    text: "Could you please send a clearer photo of the damage? The previous image was too blurry to process your claim."
  - id: "clarification_label"
    name: "Request Shipping Label"
    text: "We need a clear photo of the shipping label on the package to verify your order."
  - id: "status_update"
    name: "General Status Update"
    text: "Your claim has been received and is currently under review. We will update you shortly."
  - id: "rejection_notice"
    name: "Claim Rejected"
    text: "After reviewing your claim, we are unable to approve it as it does not meet our policy requirements."
  - id: "approval_notice"
    name: "Claim Approved"
    text: "Great news! Your claim has been approved. A replacement or refund will be processed shortly."
