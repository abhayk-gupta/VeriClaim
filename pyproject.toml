[project]
name = "vericlaim"
version = "0.1.0"
description = "Automated customer support and fraud-prevention platform for damaged product claims (voice + WhatsApp)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "redis[hiredis]>=5.0",
    "celery[redis]>=5.4",
    "langgraph>=0.2",
    "langchain-google-genai>=2.0",
    "google-generativeai>=0.8",
    "openai-whisper>=20240930",
    "piper-tts>=1.2",
    "tenacity>=8.3",
    "python-multipart>=0.0.9",
    "twilio>=9.0",
    "PyYAML>=6.0",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
